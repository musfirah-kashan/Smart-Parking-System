{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="mx-auto form-card" style="max-width: 450px; border-top: 4px solid var(--royal);">
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Smart Parking logo"
             height="56" class="mb-3"
             onerror="this.outerHTML='<div class=\'brand-mark brand-mark-lg mx-auto mb-3\'>P</div>'">
        <h3 class="mb-1">Welcome back</h3>
        <p class="text-muted mb-0">Log in to manage your parking.</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control live-check"
                   pattern="[A-Za-z0-9._+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}"
                   placeholder="name@example.com" required>
            <div class="invalid-feedback">Enter a valid email like name@example.com.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll(".live-check").forEach(function (input) {
    function check() {
        if (input.value === "") {
            input.classList.remove("is-invalid");
            return;
        }
        input.classList.toggle("is-invalid", !input.checkValidity());
    }
    input.addEventListener("input", check);
    input.addEventListener("blur", check);
});
</script>
{% endblock %}
