{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 450px;">
    <h3 class="mb-4">My Profile</h3>

    <p><strong>Role:</strong> {{ current_user.role }}</p>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
    </form>
</div>
{% endblock %}
